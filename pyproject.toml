[project]
name = "rgs-project"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rodrigo Girão Serrão", email = "5621605+rodrigogiraoserrao@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
rgs-project = "rgs_project:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.88",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
